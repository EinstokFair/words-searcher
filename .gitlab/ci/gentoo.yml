build:gentoo:
  stage: build
  image: gentoo/stage3:latest
  needs:
    - build:dist
  dependencies:
    - build:dist
  rules:
    - changes:
        - packaging/gentoo/**/*
        - src/**/*
        - Makefile.am
        - configure.ac
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
  cache:
    key: gentoo-portage-repo
    when: always
    paths:
      - .cache/portage
      - .cache/binhost
  variables:
    FEATURES: "buildpkg getbinpkg"
    ACCEPT_KEYWORDS: "~amd64"
  script:
    - mkdir -p /etc/portage/binrepos.conf /etc/portage/repos.conf
    - |
      cat > /etc/portage/binrepos.conf/gentoo.conf <<'CONF'
      [gentoo]
      priority = 1
      sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
      location = $CI_PROJECT_DIR/.cache/binhost/gentoo
      verify-signature = true
      CONF
    - |
      cat > /etc/portage/repos.conf/local.conf <<CONF
      [words-searcher]
      location = /builds/${CI_PROJECT_PATH}/packaging/gentoo
      priority = 100
      CONF
    - mkdir -p /var/cache/binpkgs /var/cache/distfiles
    - |
      TARBALL=$(awk '/^DIST/ {print $2}' packaging/gentoo/app-misc/words-searcher/Manifest)
      echo "Using tarball: $TARBALL"
      cp "$TARBALL" /var/cache/distfiles/
    - mkdir -p .cache/portage .cache/binhost /var/db/repos /var/cache
    - rm -rf /var/db/repos/gentoo /var/cache/binhost
    - ln -s "$CI_PROJECT_DIR/.cache/portage" /var/db/repos/gentoo
    - ln -s "$CI_PROJECT_DIR/.cache/binhost" /var/cache/binhost
    - if [ -z "$(ls -A .cache/portage 2>/dev/null)" ]; then emerge-webrsync; fi
    - emerge --buildpkg --oneshot app-misc/words-searcher
    - mkdir -p binpkgs
    - cp /var/cache/binpkgs/*.gpkg.tar binpkgs/ 2>/dev/null || cp /var/cache/binpkgs/*.tbz2 binpkgs/ 2>/dev/null || true
  artifacts:
    paths:
      - binpkgs/*.gpkg.tar
      - binpkgs/*.tbz2
    expire_in: 1 week

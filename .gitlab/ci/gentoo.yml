build:gentoo:
  stage: build
  image: gentoo/stage3:latest
  dependencies:
    - build:dist
  rules:
    - changes:
        - packaging/gentoo/**/*
        - src/**/*
        - Makefile.am
        - configure.ac
  cache:
    key: gentoo-portage-repo
    paths:
      - /var/db/repos/gentoo
  variables:
    FEATURES: "buildpkg"
  script:
    - mkdir -p /etc/portage/repos.conf
    - |
      cat > /etc/portage/repos.conf/local.conf <<CONF
      [words-searcher]
      location = /builds/${CI_PROJECT_PATH}/packaging/gentoo
      priority = 100
      CONF
    - mkdir -p /var/cache/binpkgs /var/cache/distfiles
    - |
      TARBALL=$(awk '/^DIST/ {print $2}' packaging/gentoo/app-misc/words-searcher/Manifest)
      echo "Using tarball: $TARBALL"
      cp "$TARBALL" /var/cache/distfiles/
    - emerge-webrsync || true
    - emerge --buildpkg --oneshot app-misc/words-searcher
    - mkdir -p binpkgs
    - cp /var/cache/binpkgs/*.gpkg.tar binpkgs/ 2>/dev/null || cp /var/cache/binpkgs/*.tbz2 binpkgs/ 2>/dev/null || true
  artifacts:
    paths:
      - binpkgs/*.gpkg.tar
      - binpkgs/*.tbz2
    expire_in: 1 week

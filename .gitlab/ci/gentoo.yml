build:gentoo:
  stage: build
  image: ws-gentoo-final:latest
  needs:
    - build:dist
  dependencies:
    - build:dist
  rules:
    - changes:
        - packaging/gentoo/**/*
        - src/**/*
        - Makefile.am
        - configure.ac
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
  variables:
    ACCEPT_KEYWORDS: "~amd64"
    FEATURES: "buildpkg"
  script:
    - mkdir -p /etc/portage/repos.conf /var/cache/distfiles /var/cache/binpkgs
    - |
      cat > /etc/portage/repos.conf/local.conf <<CONF
      [words-searcher]
      location = /builds/${CI_PROJECT_PATH}/packaging/gentoo
      priority = 100
      CONF
    - |
      TARBALL=$(awk '/^DIST/ {print $2}' packaging/gentoo/app-misc/words-searcher/Manifest)
      echo "Using tarball: $TARBALL"
      cp "$TARBALL" /var/cache/distfiles/
      chmod -R 777 /var/cache/distfiles
      echo "===== SHA256 tarball (в DISTDIR) ====="
      sha256sum "/var/cache/distfiles/$TARBALL"
      echo "===== SHA256 tarball (из build:dist) ====="
      sha256sum "$TARBALL"
      echo "===== Manifest ====="
      grep '^DIST' packaging/gentoo/app-misc/words-searcher/Manifest
    - emerge --buildpkg --oneshot app-misc/words-searcher
    - |
      echo "===== binpkg (после emerge) ====="
      ls -la /var/cache/binpkgs/ || echo "каталог пуст"
      if ! ls /var/cache/binpkgs/*.gpkg.tar 1>/dev/null 2>&1 && ! ls /var/cache/binpkgs/*.tbz2 1>/dev/null 2>&1; then
        echo "ERROR: binpkg не создан (нет *.gpkg.tar / *.tbz2 в /var/cache/binpkgs)"
        exit 1
      fi
    - mkdir -p binpkgs
    - cp /var/cache/binpkgs/*.gpkg.tar binpkgs/ 2>/dev/null || cp /var/cache/binpkgs/*.tbz2 binpkgs/ 2>/dev/null || true
  artifacts:
    paths:
      - binpkgs/*.gpkg.tar
      - binpkgs/*.tbz2
    expire_in: 1 week

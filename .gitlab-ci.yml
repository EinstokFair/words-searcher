stages:
  - build


build:dist:
  stage: build
  image: words-searcher-debian-build:latest
  variables:
    SOURCE_DATE_EPOCH: "0"
  script:
    - ./configure
    - make dist
    - echo "===== [build:dist] SHA256 tarball ====="
    - sha256sum words-searcher-*.tar.gz
    - echo "===== [build:dist] tar -tvzf (первые 10) ====="
    - tar -tvzf words-searcher-*.tar.gz > /tmp/tar-list.txt
    - head -n 10 /tmp/tar-list.txt
    - echo "===== [build:dist] tar --version / gzip --version ====="
    - tar --version | head -n1
    - gzip --version | head -n1
  artifacts:
    paths:
      - words-searcher-*.tar.gz
    expire_in: 1 week

include:
  - local: '.gitlab/ci/gentoo.yml'

build:debian:
  stage: build
  image: words-searcher-debian-build:latest
  needs:
    - build:dist
  dependencies:
    - build:dist
  script:
    # Распаковываем tarball из артефакта (версия — из имени файла)
    - TARBALL=$(basename words-searcher-*.tar.gz)
    - DIR=${TARBALL%.tar.gz}
    - tar xzf "$TARBALL"
    - cd "$DIR"
    # Копируем debian/ из репозитория (он лежит в packaging/debian)
    - cp -r ../packaging/debian debian
    # Собираем .deb
    - dpkg-buildpackage -us -uc -b
    # Smoke-тест (опционально)
    - cd ..
    - QT_QPA_PLATFORM=offscreen timeout 5 "./$DIR/words-searcher" || test $? -eq 124
  artifacts:
    paths:
      - ./*.deb
    expire_in: 1 week

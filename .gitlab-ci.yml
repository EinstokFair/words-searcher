stages:
  - build


build:dist:
  stage: build
  image: debian:trixie-slim
  variables:
    SOURCE_DATE_EPOCH: "0"
    APT_CACHE_DIR: "$CI_PROJECT_DIR/.apt-cache/archives"
  cache:
    key: apt-trixie-$CI_JOB_NAME
    when: always
    paths:
      - .apt-cache
  before_script:
    - rm -f /etc/apt/apt.conf.d/docker-clean
    - mkdir -p "$APT_CACHE_DIR/partial" /var/lib/apt/lists
  script:
    - apt-get update -o Dir::Cache::archives="$APT_CACHE_DIR"
    - apt-get install -y --no-install-recommends -o Dir::Cache::archives="$APT_CACHE_DIR" build-essential qt6-base-dev qt6-base-dev-tools qt6-l10n-tools autoconf automake libtool pkg-config ca-certificates
    - autoreconf -fi
    - ./configure
    - make dist
  artifacts:
    paths:
      - words-searcher-*.tar.gz
    expire_in: 1 week

include:
  - local: '.gitlab/ci/gentoo.yml'

build:debian:
  stage: build
  image: debian:trixie-slim
  needs:
    - build:dist
  dependencies:
    - build:dist
  variables:
    APT_CACHE_DIR: "$CI_PROJECT_DIR/.apt-cache/archives"
  cache:
    key: apt-trixie-$CI_JOB_NAME
    when: always
    paths:
      - .apt-cache
  before_script:
    - rm -f /etc/apt/apt.conf.d/docker-clean
    - mkdir -p "$APT_CACHE_DIR/partial" /var/lib/apt/lists
  script:
    - apt-get update -o Dir::Cache::archives="$APT_CACHE_DIR"
    - apt-get install -y --no-install-recommends -o Dir::Cache::archives="$APT_CACHE_DIR" build-essential qt6-base-dev qt6-base-dev-tools qt6-l10n-tools qt6-translations-l10n autoconf automake libtool pkg-config ca-certificates debhelper dpkg-dev
    # Распаковываем tarball из артефакта (версия — из имени файла)
    - TARBALL=$(basename words-searcher-*.tar.gz)
    - DIR=${TARBALL%.tar.gz}
    - tar xzf "$TARBALL"
    - cd "$DIR"
    # Копируем debian/ из репозитория (он лежит в packaging/debian)
    - cp -r ../packaging/debian debian
    # Собираем .deb
    - dpkg-buildpackage -us -uc -b
    # Smoke-тест (опционально)
    - cd ..
    - QT_QPA_PLATFORM=offscreen timeout 5 "./$DIR/words-searcher" || test $? -eq 124
  artifacts:
    paths:
      - ./*.deb
    expire_in: 1 week

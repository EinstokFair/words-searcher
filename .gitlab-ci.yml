stages:
  - build


build:dist:
  stage: build
  image: debian:trixie-slim
  variables:
    SOURCE_DATE_EPOCH: "0"
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential qt6-base-dev qt6-base-dev-tools qt6-l10n-tools autoconf automake libtool pkg-config ca-certificates
    - autoreconf -fi
    - ./configure
    - make dist
  artifacts:
    paths:
      - words-searcher-0.0.1.tar.gz
    expire_in: 1 week

include:
  - local: '.gitlab/ci/gentoo.yml'

build:debian:
  stage: build
  image: debian:trixie-slim
  needs:
    - build:dist
  dependencies:
    - build:dist
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential qt6-base-dev qt6-base-dev-tools qt6-l10n-tools qt6-translations-l10n autoconf automake libtool pkg-config ca-certificates debhelper dpkg-dev
    # Распаковываем tarball из артефакта
    - tar xzf words-searcher-0.0.1.tar.gz
    - cd words-searcher-0.0.1
    # Копируем debian/ из репозитория (он лежит в packaging/debian)
    - cp -r ../packaging/debian debian
    # Собираем .deb
    - dpkg-buildpackage -us -uc -b
    # Smoke-тест (опционально)
    - cd ..
    - QT_QPA_PLATFORM=offscreen timeout 5 ./words-searcher-0.0.1/words-searcher || test $? -eq 124
  artifacts:
    paths:
      - ./*.deb
    expire_in: 1 week

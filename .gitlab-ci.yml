stages:
  - build

include:
  - local: '.gitlab/ci/gentoo.yml'

build:debian:
  stage: build
  image: debian:trixie-slim
  rules:
    - changes:
        - src/**/*
        - Makefile.am
        - configure.ac
        - .gitlab-ci.yml
        - .gitlab/ci/debian.yml
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential qt6-base-dev qt6-base-dev-tools autoconf automake libtool pkg-config ca-certificates
    - autoreconf -fi
    - ./configure
    - make -j"$(nproc)"
    - QT_QPA_PLATFORM=offscreen timeout 5 ./words-searcher || test $? -eq 124

stages:
  - build


build:dist:
  stage: build
  image: words-searcher-debian-build:latest
  pull_policy: if-not-present
  variables:
    SOURCE_DATE_EPOCH: "0"
  script:
    - autoreconf -fi
    - ./configure
    - make dist
  artifacts:
    paths:
      - words-searcher-*.tar.gz
    expire_in: 1 week

include:
  - local: '.gitlab/ci/gentoo.yml'

build:debian:
  stage: build
  image: words-searcher-debian-build:latest
  pull_policy: if-not-present
  needs:
    - build:dist
  dependencies:
    - build:dist
  script:
    # Распаковываем tarball из артефакта (версия — из имени файла)
    - TARBALL=$(basename words-searcher-*.tar.gz)
    - DIR=${TARBALL%.tar.gz}
    - tar xzf "$TARBALL"
    - cd "$DIR"
    # Копируем debian/ из репозитория (он лежит в packaging/debian)
    - cp -r ../packaging/debian debian
    # Собираем .deb
    - dpkg-buildpackage -us -uc -b
    # Smoke-тест (опционально)
    - cd ..
    - QT_QPA_PLATFORM=offscreen timeout 5 "./$DIR/words-searcher" || test $? -eq 124
  artifacts:
    paths:
      - ./*.deb
    expire_in: 1 week

name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.github/README.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.github/README.md'

jobs:
  build-dist:
    runs-on: ubuntu-latest
    container: ghcr.io/einstokfair/words-searcher-debian-build:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball
        run: |
          ./configure
          make dist
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: words-searcher-tarball
          path: words-searcher-*.tar.gz

  build-debian:
    runs-on: ubuntu-latest
    container: ghcr.io/einstokfair/words-searcher-debian-build:latest
    needs: build-dist
    steps:
      - uses: actions/checkout@v4
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: words-searcher-tarball
      - name: Build .deb
        run: |
          TARBALL=$(basename words-searcher-*.tar.gz)
          DIR=${TARBALL%.tar.gz}
          tar xzf "$TARBALL"
          cd "$DIR"
          cp -r ../packaging/debian debian
          dpkg-buildpackage -us -uc -b
          cd ..
          mkdir -p debs
          mv ./*.deb debs/ 2>/dev/null || true
      - name: Smoke test
        run: |
          DIR=$(basename words-searcher-*.tar.gz .tar.gz)
          QT_QPA_PLATFORM=offscreen timeout 5 "./$DIR/words-searcher" || test $? -eq 124
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: words-searcher-deb
          path: debs/*.deb

  build-gentoo:
    runs-on: ubuntu-latest
    container: ghcr.io/einstokfair/words-searcher-gentoo-build:latest
    needs: build-dist
    steps:
      - uses: actions/checkout@v4
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: words-searcher-tarball
      - name: Prepare overlay and emerge
        run: |
          mkdir -p /etc/portage/repos.conf /var/cache/distfiles /var/cache/binpkgs
          cat > /etc/portage/repos.conf/local.conf <<CONF
          [words-searcher]
          location = /__w/words-searcher/words-searcher/packaging/gentoo
          priority = 100
          CONF

          TARBALL=$(awk '/^DIST/ {print $2}' packaging/gentoo/app-misc/words-searcher/Manifest)
          echo "Using tarball: $TARBALL"
          cp "$TARBALL" /var/cache/distfiles/
          chmod -R 777 /var/cache/distfiles

          echo "===== emerge ====="
          ACCEPT_KEYWORDS="~amd64" emerge --buildpkg --oneshot app-misc/words-searcher

          echo "===== binpkg ====="
          find /var/cache/binpkgs -type f -name '*.gpkg.tar' -o -name '*.tbz2' || echo "binpkg не найден"
          mkdir -p binpkgs
          find /var/cache/binpkgs -type f -name '*.gpkg.tar' -o -name '*.tbz2' | while read f; do
            cp "$f" binpkgs/
          done
      - name: Upload binpkg
        uses: actions/upload-artifact@v4
        with:
          name: words-searcher-gentoo-binpkg
          path: binpkgs/*.gpkg.tar
